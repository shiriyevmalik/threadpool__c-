name: Build & Test

on: [push, pull_request]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build

      - name: Build executable
        run: cmake --build build

      - name: Run demo
        run: ./build/pool_demo
